name: Cross-platform tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      DOUYIN_BROWSER_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run playwright install --with-deps chromium
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: uv run pytest
      - name: Check Windows transcription imports
        if: runner.os == 'Windows'
        run: |
          uv sync --locked --extra asr
          uv run --no-sync python -c "import funasr, torch, torchaudio, huggingface_hub; from funasr.utils.postprocess_utils import rich_transcription_postprocess"

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}抖音文案提取工具{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318181b'/%3E%3Cpath d='M26 20l18 12-18 12z' fill='%23ffffff'/%3E%3Ccircle cx='47' cy='18' r='5' fill='%234f46e5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <path d="M7 4.8v14.4L19.2 12z" fill="currentColor" />
            </svg>
          </span>
          <span class="brand-name">抖音文案提取</span>
        </a>
        <div class="topbar-side">
          <nav class="topbar-nav">
            <a href="/">首页</a>
          </nav>
          {% block topbar %}{% endblock %}
          <span class="badge badge-plain badge-neutral">本地运行</span>
        </div>
      </div>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <span>抖音文案提取 · 本地运行，数据不出本机</span>
        <span>输出目录 <code>output/spreadsheet/</code></span>
      </div>
    </footer>
    <script src="{{ url_for('static', path='ui.js') }}" defer></script>
  </body>
</html>

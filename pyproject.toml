[project]
name = "douyin-csv-transcriber"
version = "0.1.0"
description = "CSV-driven Douyin link parser and MLX Whisper / SenseVoice transcription web UI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "funasr>=1.3.1",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "mlx-whisper>=0.4.1",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "playwright>=1.54.0",
  "python-multipart>=0.0.9",
  "torchaudio>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
douyin-csv-webui = "app.main:run"
douyin-csv-login = "app.login_session:run"
douyin-dl = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
